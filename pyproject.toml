[project]
name = "syukatsu-support"
version = "2.2.0"
description = "Syukatsu Support Application"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai==2.15.0",
    "pydantic>=2.0.0",
    "pydantic-settings",
    "python-dotenv",
    "cryptography",
    "tenacity",
    "structlog>=25.5.0",
    "flet==0.82.2",
    "flet-desktop==0.82.2",
    "vulture>=2.16",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "pytest-mock",
    "respx",
    "ruff",
    "mypy",
    "pytest-cov",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "hypothesis",
    "pytest-mock",
    "respx",
    "ruff",
    "mypy",
    "pytest-cov",
    "pyinstaller>=6.19.0",
]
